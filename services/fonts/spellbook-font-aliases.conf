<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="weak">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Calibri Light</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Arial Narrow</family>
    <prefer><family>Liberation Sans Narrow</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>HeadLineA</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans Narrow</string>
    </edit>
    <edit name="weight" mode="assign" binding="strong">
      <const>bold</const>
    </edit>
  </match>
  <alias binding="weak">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="weak">
    <family>맑은 고딕</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Malgun Gothic</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>굴림</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>AppleSystemUIFont</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>AppleExternalUIFontKorean-Regul</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>궁서</family>
    <prefer><family>Noto Serif CJK KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Segoe UI Emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
