<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Rendering environment policy, not a text-layout correction.
       Keep explicit families first. For Korean sans-serif fallback, prefer
       the installed PowerPoint-compatible family over Linux distribution
       defaults. No effect on non-Korean, serif, or available explicit faces. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Malgun Gothic</string></edit>
  </match>
</fontconfig>
